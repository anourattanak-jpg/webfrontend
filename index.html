<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/css/Loginform/index.css">
</head>
<body>
    <form action="" class="form-login">
        <h1 class="form-title">Login</h1>
        <p class="form-sub-title">Welcome to my website</p>

        <label class="form-label" for="email">Enter Email</label>
        <input class="form-input" id="email" type="email" name="email" placeholder="Enter email" >

        <label class="form-label" for="password">Enter Password</label>
        <input class="form-input" id="password" type="password" name="password" placeholder="Enter password" ><br><br>

        
        <input type="checkbox" name="remember"> 
        <label class="label-input">Remember me</label>
        <a href="">Forgot Password?</a><br><br>
       

        <button type="submit" class="button-login">LOGIN</button>

        <p class="label-account">Don't have an account? <a href="">Create an account</a></p>
    </form>
</body>
</html>
